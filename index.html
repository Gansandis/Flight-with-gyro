<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gyro Flight</title>
<style>
:root{--bg:#1b1630;--fg:#fff4e0;--accent:#ff7a3d;--hud:rgba(27,22,48,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1630;--fg:#fff4e0}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;pointer-events:none}
#hud div{background:var(--hud);padding:6px 10px;border-radius:10px}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(27,22,48,.82);text-align:center;padding:24px}
#menu h1{margin:0;font-size:34px}
#menu p{margin:0;max-width:300px;line-height:1.5;opacity:.85}
[hidden]{display:none!important}
button{font:inherit;font-size:19px;font-weight:700;background:var(--accent);color:#1b1630;border:0;border-radius:14px;padding:14px 32px}
#tools{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
#tools button{font-size:14px;padding:8px 12px;background:var(--hud);color:var(--fg)}
#msg{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:28px;font-weight:700;color:var(--accent);pointer-events:none;opacity:0;transition:opacity .3s}
</style>
</head>
<body>
<div id="hud"><div id="rp">ROLL 0 PITCH 0</div><div id="sc">0 ม.</div></div>
<div id="msg">ชน! เริ่มใหม่</div>
<div id="tools" hidden><button id="cal">รีเซ็ตมุม</button><button id="fs">เต็มจอ</button></div>
<div id="menu">
  <h1>Gyro Flight</h1>
  <p>ถือมือถือแนวตั้ง เอียงซ้าย-ขวาเพื่อเลี้ยว ดันหัวเครื่องออกเพื่อพุ่งลง ดึงเข้าหาตัวเพื่อไต่ขึ้น หลบตึกให้ได้ไกลที่สุด</p>
  <button id="go">เริ่มบิน</button>
  <p style="font-size:13px">บนคอมพิวเตอร์ ลากเมาส์เพื่อบังคับ</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), D=Math.PI/180;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const sky=new THREE.Color(0xf2a672);
scene.background=sky; scene.fog=new THREE.Fog(sky,120,520);
const cam=new THREE.PerspectiveCamera(70,1,0.5,900);
scene.add(new THREE.HemisphereLight(0xffe2c0,0x3a2f5c,1.1));
const sun=new THREE.DirectionalLight(0xffffff,.8); sun.position.set(-1,2,.5); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshLambertMaterial({color:0x2b2547}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// plane
const plane=new THREE.Group();
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const body=new THREE.Mesh(new THREE.BoxGeometry(1,1,6),mat(0xfff4e0));
const wing=new THREE.Mesh(new THREE.BoxGeometry(8,.2,1.6),mat(0xff3d3d)); wing.position.z=-.3;
const tail=new THREE.Mesh(new THREE.BoxGeometry(2.6,.2,1),mat(0xff3d3d)); tail.position.z=2.4;
const fin=new THREE.Mesh(new THREE.BoxGeometry(.2,1.4,1),mat(0xff3d3d)); fin.position.set(0,.8,2.4);
plane.add(body,wing,tail,fin); plane.rotation.order="YXZ"; scene.add(plane);

// city
const N=420,R=420,CELL=R*2,boxes=[];
const geo=new THREE.BoxGeometry(1,1,1);
function setBox(b,x,z){
  const w=14+Math.random()*22,h=20+Math.random()*80;
  b.position.set(x,h/2,z); b.scale.set(w,h,w); b.userData={w,h};
  b.material.color.setHSL(.05+Math.random()*.12,.45,.45+Math.random()*.25);
}
for(let i=0;i<N;i++){
  const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial());
  setBox(m,(Math.random()*2-1)*R,(Math.random()*2-1)*R); scene.add(m); boxes.push(m);
}

// state
let pos=new THREE.Vector3(0,110,0),yaw=0,pitch=0,roll=0,dist=0,speed=55;
let tRoll=0,tPitch=0,beta0=null,lastBeta=0,gotSensor=false,running=false,crashT=0;
const rp=document.getElementById("rp"),sc=document.getElementById("sc"),msg=document.getElementById("msg");

function onOrient(e){
  if(e.beta==null)return;
  gotSensor=true; lastBeta=e.beta;
  if(beta0===null)beta0=e.beta;
  tRoll=clamp(e.gamma*D,-1.0,1.0);
  tPitch=clamp(-(e.beta-beta0)*D,-.9,.9);
}
function onPointer(e){
  if(gotSensor)return;
  tRoll=clamp((e.clientX/innerWidth-.5)*2,-1,1)*1.0;
  tPitch=clamp(-(e.clientY/innerHeight-.5)*2,-1,1)*.9;
}
addEventListener("pointermove",onPointer);

document.getElementById("go").onclick=async()=>{
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r==="granted")addEventListener("deviceorientation",onOrient);
    }else addEventListener("deviceorientation",onOrient);
  }catch(err){}
  document.getElementById("menu").hidden=true;
  document.getElementById("tools").hidden=false;
  running=true;
  setTimeout(()=>{if(!gotSensor){msg.textContent="ไม่พบเซ็นเซอร์ ลากนิ้วบนจอเพื่อบังคับแทน";msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,3000)}},1500);
};
document.getElementById("cal").onclick=()=>{beta0=lastBeta};
document.getElementById("fs").onclick=()=>{
  const el=document.documentElement;
  try{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(err){}
};

function crash(){
  crashT=1; msg.style.opacity=1; setTimeout(()=>msg.style.opacity=0,900);
  pos.y=110; dist=0; pitch=0; roll=0;
  boxes.forEach(b=>{ if(Math.abs(b.position.x-pos.x)<80&&Math.abs(b.position.z-pos.z)<80) b.scale.y=1,b.position.y=.5,b.userData.h=1; });
}

function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener("resize",resize); resize();

const fwd=new THREE.Vector3(),camT=new THREE.Vector3(),look=new THREE.Vector3();
let last=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-last)/1000,.05); last=t;
  if(running){
    roll+=(tRoll-roll)*Math.min(1,dt*6);
    pitch+=(tPitch-pitch)*Math.min(1,dt*6);
    yaw-=roll*1.3*dt;
    plane.rotation.set(pitch,yaw,-roll);
    fwd.set(0,0,-1).applyEuler(plane.rotation);
    pos.addScaledVector(fwd,speed*dt);
    pos.y=Math.min(pos.y,260);
    dist+=speed*dt;
    for(const b of boxes){
      const p=b.position;
      if(p.x-pos.x>R)p.x-=CELL; else if(p.x-pos.x<-R)p.x+=CELL;
      if(p.z-pos.z>R)setBox(b,p.x,p.z-CELL); else if(p.z-pos.z<-R)setBox(b,p.x,p.z+CELL);
      const u=b.userData;
      if(Math.abs(p.x-pos.x)<u.w/2+1.5&&Math.abs(p.z-pos.z)<u.w/2+1.5&&pos.y<u.h+1)crash();
    }
    if(pos.y<1.5)crash();
    plane.position.copy(pos);
    ground.position.set(pos.x,0,pos.z);
    rp.textContent="ROLL "+Math.round(roll/D)+"° PITCH "+Math.round(pitch/D)+"°";
    sc.textContent=Math.round(dist)+" ม.";
  }
  camT.set(0,3.2,10).applyEuler(plane.rotation).add(plane.position);
  cam.position.lerp(camT,Math.min(1,dt*7));
  look.copy(fwd).multiplyScalar(30).add(plane.position);
  cam.lookAt(look);
  renderer.render(scene,cam);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
